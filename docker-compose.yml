name: eparking-dashboard

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eparking}
      POSTGRES_USER: ${POSTGRES_USER:-eparking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eparking_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eparking} -d ${POSTGRES_DB:-eparking}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    command: ["python", "-m", "app.migrate"]
    environment: &app_env
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-eparking}
      POSTGRES_USER: ${POSTGRES_USER:-eparking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eparking_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-sk_test_placeholder_replace_me}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-do-not-use-in-production}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-dev-only-encryption-key-do-not-use-in-prod}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-do-not-use-in-production}
      VIEWER_API_KEY: ${VIEWER_API_KEY:-dev-viewer-key-do-not-use-in-production}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      <<: *app_env
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-worker:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=INFO"]
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-beat:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=INFO"]
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
