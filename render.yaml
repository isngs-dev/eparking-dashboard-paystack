services:
  - type: keyvalue
    name: eparking-redis
    region: frankfurt
    plan: free
    # Empty allow list = no public/external access. Render services in the
    # same region (eparking-api/worker/beat below) always reach this over
    # the private network via its internal URL regardless of this list --
    # see https://render.com/docs/key-value. Internal-URL connections are
    # unauthenticated by default, so REDIS_PASSWORD below is left blank.
    ipAllowList: []

  - type: web
    name: eparking-api
    runtime: docker
    region: frankfurt
    dockerfilePath: services/api/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
      - key: PORT
        value: 8000
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_DB
        value: eparking
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SECRET_ENCRYPTION_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_MINUTES
        value: 60
      - key: ADMIN_API_KEY
        sync: false
      - key: VIEWER_API_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_DB
        value: 0
      - key: REDIS_PASSWORD
        sync: false

  - type: worker
    name: eparking-worker
    runtime: docker
    region: frankfurt
    dockerfilePath: services/ingestion/Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.celery_app worker --loglevel=INFO
    plan: starter
    preDeployCommand: python -m app.migrate
    envVars:
      - key: APP_ENV
        value: production
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_DB
        value: eparking
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SECRET_ENCRYPTION_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_MINUTES
        value: 60
      - key: ADMIN_API_KEY
        sync: false
      - key: VIEWER_API_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_DB
        value: 0
      - key: REDIS_PASSWORD
        sync: false

  - type: worker
    name: eparking-beat
    runtime: docker
    region: frankfurt
    dockerfilePath: services/ingestion/Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.celery_app beat --loglevel=INFO
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_DB
        value: eparking
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SECRET_ENCRYPTION_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_MINUTES
        value: 60
      - key: ADMIN_API_KEY
        sync: false
      - key: VIEWER_API_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_DB
        value: 0
      - key: REDIS_PASSWORD
        sync: false

  - type: web
    name: eparking-frontend
    runtime: node
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: starter
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: VIEWER_API_KEY
        sync: false
